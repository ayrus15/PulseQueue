# Render Blueprint - deploys the API (which also serves the dashboard
# at /ui) and the worker from the same Dockerfile this repo already
# has. PostgreSQL and Redis are NOT defined here - this project uses
# Supabase (Postgres) and Upstash (Redis) instead of Render's own
# managed databases; see docs/deployment.md for why and how to wire
# their connection strings into the env vars below.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Render reads this file and creates both services; you fill in the
# env vars marked `sync: false` yourself (Render prompts for these,
# they're never committed to the repo).
services:
  - type: web
    name: pulsequeue-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/live
    # Applies pending migrations before every deploy, then starts the
    # API - alembic upgrade head is a no-op when already current, so
    # this is safe to run on every boot, not just the first one.
    dockerCommand: sh -c "alembic upgrade head && exec uvicorn pulsequeue.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PULSEQUEUE_ADMIN_TOKEN
        sync: false
      - key: PULSEQUEUE_LOG_LEVEL
        value: INFO

  - type: worker
    name: pulsequeue-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    dockerCommand: python -m pulsequeue.workers.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PULSEQUEUE_LOG_LEVEL
        value: INFO
