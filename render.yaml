# Render Blueprint - deploys the API (which also serves the dashboard
# at /ui) from the same Dockerfile this repo already has.
#
# PULSEQUEUE_RUN_WORKER_IN_PROCESS=true below runs the worker as a
# background task inside this same service - Render's free tier has
# no Background Worker offering, so this keeps the whole deployment to
# one free service and zero extra accounts/cards. It's a documented
# deployment-cost concession, not this project's real architecture
# (see docs/architecture.md and src/pulsequeue/main.py's lifespan) -
# if you'd rather run the worker as its own process, the alternative
# is deploy/gcp/setup.sh (a free GCP VM, though GCP requires a card on
# file even for its free tier) - see docs/deployment.md.
#
# PostgreSQL and Redis also aren't defined here - this project uses
# Supabase (Postgres) and Upstash (Redis) instead of Render's own
# managed databases; see docs/deployment.md for why and how to wire
# their connection strings into the env vars below.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# Render reads this file and proposes the service below; you fill in
# the env vars marked `sync: false` yourself (Render prompts for
# these, they're never committed to the repo).
services:
  - type: web
    name: pulsequeue-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/live
    # A script file, not an inline shell string - Render's dockerCommand
    # doesn't reliably interpret shell syntax (&&, quotes) passed inline
    # here, confirmed by it literally failing to find a command named
    # "alembic upgrade head && exec uvicorn ..." on a real deploy. See
    # deploy/render/start.sh for what this actually runs.
    dockerCommand: ./deploy/render/start.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PULSEQUEUE_ADMIN_TOKEN
        sync: false
      - key: PULSEQUEUE_LOG_LEVEL
        value: INFO
      - key: PULSEQUEUE_RUN_WORKER_IN_PROCESS
        value: "true"
