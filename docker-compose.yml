# One-command local stack: PostgreSQL, Redis, a one-shot migration
# step, the API, and a worker. See README.md's "Running the stack"
# section for the exact commands and what to expect.
services:
  postgres:
    # Matches the version this project is developed and tested against
    # (see docs/decisions/0000-acceptance-criteria.md and
    # .github/workflows/ci.yml).
    image: postgres:18
    environment:
      POSTGRES_USER: pulsequeue
      POSTGRES_PASSWORD: change-me-locally
      POSTGRES_DB: pulsequeue
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsequeue"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://pulsequeue:change-me-locally@postgres:5432/pulsequeue
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pulsequeue:change-me-locally@postgres:5432/pulsequeue
      REDIS_URL: redis://redis:6379/0
      PULSEQUEUE_ADMIN_TOKEN: change-me-locally
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    command: python -m pulsequeue.workers.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://pulsequeue:change-me-locally@postgres:5432/pulsequeue
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
