[project]
name = "pulsequeue"
version = "0.1.0"
description = "A distributed task processing and reliability platform built on FastAPI, PostgreSQL, and Redis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "PulseQueue contributors" }]

dependencies = [
    "fastapi>=0.162,<0.163",
    # Pinned above fastapi's own minimum (>=0.46.0) to close known starlette
    # CVEs (Phase 8 dependency audit, pip-audit) that 0.46.2 is still subject to.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<1.14",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "redis>=5.0,<6",
    "python-json-logger>=3,<5",
    "prometheus-client>=0.20,<0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=6.0,<7",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<1.14",
]
benchmark = [
    "locust>=2.47,<3",
]

[build-system]
requires = ["setuptools>=84.1.0"]  # Phase 8 dependency audit: closes known setuptools CVEs.
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# N (pep8-naming) is intentionally excluded: this project uses camelCase
# function names as a documented repository convention (see README).
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicit as of pytest-asyncio 1.x - "function" matches this project's
# function-scoped async engine fixtures (see docs/operationsRunbook.md on
# why a broader scope corrupts asyncio internals on Windows).
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
